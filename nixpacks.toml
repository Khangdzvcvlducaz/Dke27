[phases.setup]
nixPkgs = ["bun", "nodejs_18"]

[phases.install]
cmds = ["bun install", "cd mini-services/realtime-sync && bun install && cd ../.."]
cacheDirs = ["/root/.bun/install/cache"]

[phases.build]
cmds = ["bun run db:generate", "bun run build"]

[start]
# Use start.sh — runs db:push + custom-server (Next.js + Socket.io same port)
cmd = "sh start.sh"

[variables]
PORT = "3000"
