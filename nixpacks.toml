[phases.setup]
nixPkgs = ["bun", "nodejs_18"]

[phases.install]
cmds = ["bun install", "cd mini-services/realtime-sync && bun install && cd ../.."]
cacheDirs = ["/root/.bun/install/cache"]

[phases.build]
cmds = ["bun run db:generate", "bun run db:push", "bun run build"]

[start]
cmd = "concurrently 'bun run start' 'cd mini-services/realtime-sync && bun run index.ts'"

[variables]
PORT = "3000"
