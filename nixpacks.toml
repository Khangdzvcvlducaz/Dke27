[phases.setup]
nixPkgs = ["bun", "nodejs_18"]

[phases.install]
cmds = ["bun install", "cd mini-services/realtime-sync && bun install && cd ../.."]
cacheDirs = ["/root/.bun/install/cache"]

[phases.build]
cmds = ["bun run db:generate", "bun run build"]

[start]
# Use the start.sh script — handles db:push + both services
# Railway executes this directly (no shell needed for the script path)
cmd = "bash start.sh"

[variables]
PORT = "3000"
